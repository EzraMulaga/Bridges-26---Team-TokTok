<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Medical Practitioner Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-card">
        <h1>Practitioner Login</h1>
        <p class="subtitle">
            Authorized medical professionals only
        </p>

        <form action="full-history.html" method="GET">
            <!-- Preserve patient context -->
            <input type="hidden" name="patientId" value="JD-1995-0314">

            <label for="practitionerId">Practitioner ID</label>
            <input type="text" id="practitionerId" placeholder="MP-1029" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" required>

            <button type="submit">Login</button>
        </form>

        <p class="note">
            Access attempts are logged and monitored.
        </p>
    </div>

</body>
</html>
